name: netflix_pro
description: "Netflix Pro Streaming App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  android_intent_plus: ^5.0.2
  video_player: ^2.8.2
  volume_controller: ^2.0.8
  screen_brightness: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "icon.png"

flutter:
  uses-material-design: true