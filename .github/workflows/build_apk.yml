name: Build and Release Netflix Pro APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.29)'
        required: true
        default: 'v1.0.29'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Setup & Build Netflix Pro App
        run: |
          flutter create --org com.netflixpro --project-name netflix_pro netflix_build_temp
          
          # Pehle dummy lib delete karenge aur apna asli lib seedha copy karenge
          rm -rf netflix_build_temp/lib
          cp -r lib netflix_build_temp/
          
          cp pubspec.yaml netflix_build_temp/pubspec.yaml
          cp icon.png netflix_build_temp/icon.png
          
          # Clean App Name set karein
          sed -i 's/android:label="[^"]*"/android:label="Netflix Pro"/' netflix_build_temp/android/app/src/main/AndroidManifest.xml
          
          # Internet & Cleartext HTTP fix
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' netflix_build_temp/android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' netflix_build_temp/android/app/src/main/AndroidManifest.xml
          
          # Android TV Flags (Leanback & Remote Support)
          sed -i '/<application/i <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n<uses-feature android:name="android.software.leanback" android:required="false" />' netflix_build_temp/android/app/src/main/AndroidManifest.xml
          sed -i '/android.intent.category.LAUNCHER/a <category android:name="android.intent.category.LEANBACK_LAUNCHER" />' netflix_build_temp/android/app/src/main/AndroidManifest.xml
          
          cd netflix_build_temp
          flutter pub get
          dart run flutter_launcher_icons

          # Debug: Verify files structure
          ls -R lib/

          # 1. Build Mobile APK
          flutter build apk --release -t lib/mobile/main.dart
          cp build/app/outputs/flutter-apk/app-release.apk ../Netflix-Pro-Mobile.apk

          # 2. Build TV APK
          flutter build apk --release -t lib/tv/main.dart
          cp build/app/outputs/flutter-apk/app-release.apk ../Netflix-Pro-TV.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: "Netflix Pro ${{ github.event.inputs.version_tag }}"
          body: |
            ## Netflix Pro ${{ github.event.inputs.version_tag }}
            * **Netflix-Pro-Mobile.apk**: Mobile Touch UI & Gesture Player
            * **Netflix-Pro-TV.apk**: Android TV Leanback UI & D-pad Just Player
          files: |
            Netflix-Pro-Mobile.apk
            Netflix-Pro-TV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
