name: Build and Release Netflix Pro APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.30)'
        required: true
        default: 'v1.0.30'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Setup & Build Netflix Pro App
        run: |
          flutter create --org com.netflixpro --project-name netflix_pro netflix_build_temp
          
          rm -rf netflix_build_temp/lib
          cp -r lib netflix_build_temp/
          cp pubspec.yaml netflix_build_temp/pubspec.yaml
          cp icon.png netflix_build_temp/icon.png
          
          cd netflix_build_temp
          flutter pub get
          dart run flutter_launcher_icons

          # -------------------------------------------------------------
          # 1. BUILD MOBILE APK
          # -------------------------------------------------------------
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="Netflix Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/launcher_icon"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          flutter build apk --release -t lib/mobile/main.dart
          cp build/app/outputs/flutter-apk/app-release.apk ../Netflix-Pro-Mobile.apk

          # -------------------------------------------------------------
          # 2. BUILD ANDROID TV APK (Landscape + Leanback TV Banner)
          # -------------------------------------------------------------
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="true" />
              <application
                  android:label="Netflix Pro TV"
                  android:name="${applicationName}"
                  android:icon="@mipmap/launcher_icon"
                  android:banner="@mipmap/launcher_icon"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="landscape"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          flutter build apk --release -t lib/tv/main.dart
          cp build/app/outputs/flutter-apk/app-release.apk ../Netflix-Pro-TV.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: "Netflix Pro ${{ github.event.inputs.version_tag }}"
          body: |
            ## Netflix Pro ${{ github.event.inputs.version_tag }}
            * **Netflix-Pro-Mobile.apk**: Touch UI, ±30s Controls, Stream Selector
            * **Netflix-Pro-TV.apk**: Android TV 16:9 Landscape UI with Remote Navigation
          files: |
            Netflix-Pro-Mobile.apk
            Netflix-Pro-TV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
