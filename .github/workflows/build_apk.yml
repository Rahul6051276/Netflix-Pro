name: Build and Release Netflix Pro APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.31)'
        required: true
        default: 'v1.0.31'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Setup & Build Netflix Pro App
        run: |
          flutter create --org com.netflixpro --project-name netflix_pro netflix_build_temp

          rm -rf netflix_build_temp/lib
          cp -r lib netflix_build_temp/
          cp pubspec.yaml netflix_build_temp/pubspec.yaml
          cp icon.png netflix_build_temp/icon.png

          # Clean App Name & Permissions
          sed -i 's/android:label="[^"]*"/android:label="Netflix Pro"/' netflix_build_temp/android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' netflix_build_temp/android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' netflix_build_temp/android/app/src/main/AndroidManifest.xml

          # Copy Native Kotlin Media3 Player Files
          mkdir -p netflix_build_temp/android/app/src/main/kotlin/com/netflixpro/netflix_pro
          mkdir -p netflix_build_temp/android/app/src/main/res/layout
          cp native_android/MainActivity.kt netflix_build_temp/android/app/src/main/kotlin/com/netflixpro/netflix_pro/MainActivity.kt
          cp native_android/CinemaPictureEffect.kt netflix_build_temp/android/app/src/main/kotlin/com/netflixpro/netflix_pro/CinemaPictureEffect.kt
          cp native_android/CinemaPlayerActivity.kt netflix_build_temp/android/app/src/main/kotlin/com/netflixpro/netflix_pro/CinemaPlayerActivity.kt
          cp native_android/activity_cinema_player.xml netflix_build_temp/android/app/src/main/res/layout/activity_cinema_player.xml

          # Register CinemaPlayerActivity in AndroidManifest.xml
          sed -i 's|</application>|    <activity android:name=".CinemaPlayerActivity" android:exported="false" android:screenOrientation="sensorLandscape" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|navigation" />\n    </application>|' netflix_build_temp/android/app/src/main/AndroidManifest.xml

          # Add Media3 ExoPlayer 1.4.1 dependencies
          if [ -f netflix_build_temp/android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' netflix_build_temp/android/app/build.gradle.kts
            printf '\ndependencies {\n    implementation("androidx.media3:media3-exoplayer:1.4.1")\n    implementation("androidx.media3:media3-exoplayer-hls:1.4.1")\n    implementation("androidx.media3:media3-exoplayer-dash:1.4.1")\n    implementation("androidx.media3:media3-ui:1.4.1")\n    implementation("androidx.media3:media3-effect:1.4.1")\n    implementation("androidx.media3:media3-common:1.4.1")\n}\n' >> netflix_build_temp/android/app/build.gradle.kts
          else
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' netflix_build_temp/android/app/build.gradle
            printf '\ndependencies {\n    implementation "androidx.media3:media3-exoplayer:1.4.1"\n    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"\n    implementation "androidx.media3:media3-exoplayer-dash:1.4.1"\n    implementation "androidx.media3:media3-ui:1.4.1"\n    implementation "androidx.media3:media3-effect:1.4.1"\n    implementation "androidx.media3:media3-common:1.4.1"\n}\n' >> netflix_build_temp/android/app/build.gradle
          fi

          cd netflix_build_temp
          flutter pub get
          dart run flutter_launcher_icons

          # 1. BUILD MOBILE APK
          flutter build apk --release -t lib/mobile/main.dart
          cp build/app/outputs/flutter-apk/app-release.apk ../Netflix-Pro-Mobile.apk

          # 2. CONFIGURE & BUILD ANDROID TV APK
          sed -i '/<application/i <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n<uses-feature android:name="android.software.leanback" android:required="false" />' android/app/src/main/AndroidManifest.xml
          sed -i '/android.intent.category.LAUNCHER/a <category android:name="android.intent.category.LEANBACK_LAUNCHER" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml

          flutter build apk --release -t lib/tv/main.dart
          cp build/app/outputs/flutter-apk/app-release.apk ../Netflix-Pro-TV.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: "Netflix Pro ${{ github.event.inputs.version_tag }}"
          body: |
            ## Netflix Pro ${{ github.event.inputs.version_tag }}
            * **Netflix-Pro-Mobile.apk**: Touch UI + Kotlin Media3 HDR Player
            * **Netflix-Pro-TV.apk**: Android TV 16:9 UI + Kotlin Media3 HDR Player
          files: |
            Netflix-Pro-Mobile.apk
            Netflix-Pro-TV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
