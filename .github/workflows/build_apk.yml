name: Build and Release Netflix Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Build Project Setup
        run: |
          flutter create netflix_build_temp
          cp pubspec.yaml netflix_build_temp/
          # Pura lib folder copy karein taaki main.dart aur internal_player.dart dono jayein
          cp -r lib/* netflix_build_temp/lib/
          
          # AndroidManifest me cleartext traffic inject karein
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' netflix_build_temp/android/app/src/main/AndroidManifest.xml
          
          cd netflix_build_temp
          flutter pub get
          flutter build apk --release

      - name: Move APK for Release
        run: |
          mkdir -p build_output
          cp netflix_build_temp/build/app/outputs/flutter-apk/app-release.apk build_output/Netflix-Pro.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: Netflix Pro v1.0.9
          files: build_output/Netflix-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
